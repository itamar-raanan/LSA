name: lsa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tls-permissions:
    image: alpine:3.22
    command: ["sh", "-c", "chgrp 101 /tls && chmod 0770 /tls"]
    restart: "no"
    volumes:
      - lsa-tls-runtime:/tls
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LSA_POSTGRES_DB:-lsa}
      POSTGRES_USER: ${LSA_POSTGRES_USER:-lsa}
      POSTGRES_PASSWORD: ${LSA_POSTGRES_PASSWORD:?Set LSA_POSTGRES_PASSWORD in deploy/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - lsa-postgres:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LSA_S3_ACCESS_KEY:?Set LSA_S3_ACCESS_KEY in deploy/.env}
      MINIO_ROOT_PASSWORD: ${LSA_S3_SECRET_KEY:?Set LSA_S3_SECRET_KEY in deploy/.env}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - lsa-evidence:/data
    networks:
      - backend
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      LSA_ENVIRONMENT: production
      LSA_DATABASE_URL: postgresql+psycopg://${LSA_POSTGRES_USER:-lsa}:${LSA_POSTGRES_PASSWORD}@postgres:5432/${LSA_POSTGRES_DB:-lsa}
      LSA_CORS_ORIGINS: '[]'
      LSA_SESSION_SECRET: ${LSA_SESSION_SECRET:?Set LSA_SESSION_SECRET in deploy/.env}
      LSA_SETTINGS_ENCRYPTION_KEY: ${LSA_SETTINGS_ENCRYPTION_KEY:?Set LSA_SETTINGS_ENCRYPTION_KEY in deploy/.env}
      LSA_PUBLIC_URL: https://${LSA_TLS_HOST:-localhost}:${LSA_TLS_PORT:-8443}
      LSA_ALLOW_PRIVATE_IDENTITY_PROVIDERS: ${LSA_ALLOW_PRIVATE_IDENTITY_PROVIDERS:-false}
      LSA_TLS_CERTIFICATE_PATH: /tls/tls.crt
      LSA_TLS_PRIVATE_KEY_PATH: /tls/tls.key
      LSA_TLS_SHARED_GID: 101
      LSA_BOOTSTRAP_EMAIL: ${LSA_BOOTSTRAP_EMAIL:-admin@lsa.local}
      LSA_BOOTSTRAP_PASSWORD: ${LSA_BOOTSTRAP_PASSWORD:?Set LSA_BOOTSTRAP_PASSWORD in deploy/.env}
      LSA_SEED_DEMO: ${LSA_SEED_DEMO:-false}
      LSA_REQUIRE_SIGNED_BUNDLES: ${LSA_REQUIRE_SIGNED_BUNDLES:-false}
      LSA_WEB_CONCURRENCY: ${LSA_WEB_CONCURRENCY:-2}
      LSA_MAX_UPLOAD_BYTES: ${LSA_MAX_UPLOAD_BYTES:-26214400}
      LSA_ARTIFACT_BACKEND: s3
      LSA_ARTIFACT_RETENTION_DAYS: ${LSA_ARTIFACT_RETENTION_DAYS:-365}
      LSA_S3_ENDPOINT_URL: http://minio:9000
      LSA_S3_BUCKET: ${LSA_S3_BUCKET:-lsa-evidence}
      LSA_S3_REGION: ${LSA_S3_REGION:-us-east-1}
      LSA_S3_ACCESS_KEY: ${LSA_S3_ACCESS_KEY}
      LSA_S3_SECRET_KEY: ${LSA_S3_SECRET_KEY}
      # The bundled MinIO stores data inside the private evidence volume. Set
      # AES256 only after configuring MinIO KMS/SSE support.
      LSA_S3_SERVER_SIDE_ENCRYPTION: ${LSA_S3_SERVER_SIDE_ENCRYPTION:-none}
    depends_on:
      tls-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    group_add:
      - "101"
    volumes:
      - lsa-tls-runtime:/tls
    networks:
      - backend
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${LSA_TLS_BIND:-127.0.0.1}:${LSA_TLS_PORT:-8443}:8443"
    volumes:
      - lsa-tls-runtime:/tls:ro
    networks:
      - edge
      - backend
    logging: *default-logging

volumes:
  lsa-postgres:
  lsa-evidence:
  lsa-tls-runtime:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
