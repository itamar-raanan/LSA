services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lsa
      POSTGRES_USER: lsa
      POSTGRES_PASSWORD: lsa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - lsa-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lsa
      MINIO_ROOT_PASSWORD: lsa-development-only
    ports:
      - "9001:9001"
    volumes:
      - lsa-artifacts:/data

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      LSA_DATABASE_URL: postgresql+psycopg://lsa:lsa@postgres:5432/lsa
      LSA_CORS_ORIGINS: '["http://localhost:5173"]'
      LSA_SESSION_SECRET: development-session-secret-change-in-production
      LSA_BOOTSTRAP_PASSWORD: lsa-dev-password
      LSA_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  lsa-postgres:
  lsa-artifacts:

