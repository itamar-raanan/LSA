[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-security-auditor"
version = "0.1.0"
description = "Ingestion-first Linux fleet security and compliance platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pyrad>=2.4,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.43,<3",
  "psycopg[binary]>=3.2.9,<4",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "ansible-core>=2.18,<3",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/lsa"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["apps/api/tests", "scanner/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008", # FastAPI dependency injection uses calls in parameter defaults by design.
  "E501", # Formatters and readable schemas/templates may exceed the display width.
  "I001"  # Import organization is non-blocking for the v0.1 foundation.
]
