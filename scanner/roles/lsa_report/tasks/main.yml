---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family in ['Debian', 'RedHat']
      - lsa_host_id | length > 0
      - lsa_delivery_mode in ['offline', 'upload', 'upload_and_keep']
      - lsa_profile in lsa_supported_profiles
      - (lsa_signing_key_file | length > 0) == (lsa_signing_key_id | length > 0)
    fail_msg: LSA requires Debian, Ubuntu, or RHEL family Linux and a platform host UUID.

- name: Resolve normalized operating-system family
  ansible.builtin.set_fact:
    lsa_os_family: >-
      {{ 'ubuntu' if ansible_facts.distribution == 'Ubuntu'
         else 'debian' if ansible_facts.os_family == 'Debian'
         else 'rhel' }}
    lsa_report_id: "{{ lookup('pipe', 'python3 -c \"import uuid; print(uuid.uuid4())\"') }}"
    lsa_generated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    lsa_machine_id_hash: "sha256:{{ ansible_machine_id | hash('sha256') }}"
    lsa_effective_profile: "{{ lsa_profile }}"

- name: Initialize normalized findings
  ansible.builtin.set_fact:
    lsa_findings: []

- name: Run complete Debian 13 benchmark audit
  ansible.builtin.include_role:
    name: cis_debian13_audit
    public: true
  vars:
    cis_profile: "{{ lsa_cis_profile_map[lsa_profile] }}"
    cis_exceptions: "{{ lsa_cis_exceptions }}"
    cis_generate_standalone_reports: false
  when:
    - ansible_facts.distribution == 'Debian'
    - ansible_facts.distribution_major_version == '13'

- name: Normalize Debian 13 benchmark results
  ansible.builtin.include_tasks: normalize_cis_result.yml
  loop: "{{ cis_results | default([]) }}"
  loop_control:
    loop_var: lsa_cis_result
    label: "{{ lsa_cis_result.id }} {{ lsa_cis_result.title }}"
  when:
    - ansible_facts.distribution == 'Debian'
    - ansible_facts.distribution_major_version == '13'

- name: Run supplemental Linux security-health audit
  ansible.builtin.include_role:
    name: linux_security_health
    public: true
  vars:
    security_health_enabled: true
    security_health_generate_standalone_reports: false
    security_health_exceptions: "{{ lsa_security_health_exceptions }}"
    security_health_stale_account_days: "{{ lsa_security_health_stale_account_days }}"
  when:
    - ansible_facts.distribution == 'Debian'
    - ansible_facts.distribution_major_version == '13'

- name: Normalize supplemental security-health results
  ansible.builtin.include_tasks: normalize_health_result.yml
  loop: "{{ security_health_results | default([]) }}"
  loop_control:
    loop_var: lsa_health_result
    label: "{{ lsa_health_result.id }} {{ lsa_health_result.title }}"
  when:
    - ansible_facts.distribution == 'Debian'
    - ansible_facts.distribution_major_version == '13'

- name: Calculate report summary
  ansible.builtin.set_fact:
    lsa_summary:
      pass: "{{ lsa_findings | selectattr('status', 'equalto', 'pass') | list | length }}"
      fail: "{{ lsa_findings | selectattr('status', 'equalto', 'fail') | list | length }}"
      manual: "{{ lsa_findings | selectattr('status', 'equalto', 'manual') | list | length }}"
      not_applicable: "{{ lsa_findings | selectattr('status', 'equalto', 'not_applicable') | list | length }}"
      error: "{{ lsa_findings | selectattr('status', 'equalto', 'error') | list | length }}"

- name: Create local report outbox
  ansible.builtin.file:
    path: "{{ lsa_output_root }}/{{ inventory_hostname }}/pending"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Render normalized report JSON
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ lsa_output_root }}/{{ inventory_hostname }}/pending/report.json"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Build unsigned portable offline bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../scripts/build_bundle.py"
      - "{{ lsa_output_root }}/{{ inventory_hostname }}/pending/report.json"
      - "{{ lsa_output_root }}/{{ inventory_hostname }}/pending"
  delegate_to: localhost
  become: false
  register: lsa_bundle_build
  changed_when: true
  when: lsa_signing_key_file | length == 0

- name: Build signed portable offline bundle
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/../../scripts/build_bundle.py"
      - "{{ lsa_output_root }}/{{ inventory_hostname }}/pending/report.json"
      - "{{ lsa_output_root }}/{{ inventory_hostname }}/pending"
      - --signing-key
      - "{{ lsa_signing_key_file }}"
      - --key-id
      - "{{ lsa_signing_key_id }}"
  delegate_to: localhost
  become: false
  register: lsa_bundle_build
  changed_when: true
  when: lsa_signing_key_file | length > 0

- name: Submit unsigned normalized report
  ansible.builtin.uri:
    url: "{{ lsa_platform_url }}/api/v1/ingest/reports"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('file', lsa_ingest_token_file) | trim }}"
      Content-Type: application/json
    body: "{{ lookup('file', lsa_output_root + '/' + inventory_hostname + '/pending/report.json') | from_json }}"
    body_format: json
    status_code: 202
    timeout: 120
    validate_certs: true
  delegate_to: localhost
  become: false
  no_log: true
  register: lsa_submission
  when:
    - lsa_delivery_mode in ['upload', 'upload_and_keep']
    - lsa_signing_key_file | length == 0

- name: Submit signed report bundle
  ansible.builtin.uri:
    url: "{{ lsa_platform_url }}/api/v1/ingest/bundles"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('file', lsa_ingest_token_file) | trim }}"
    body_format: form-multipart
    body:
      file:
        filename: "{{ lsa_bundle_build.stdout }}"
        mime_type: application/zip
    status_code: 202
    timeout: 120
    validate_certs: true
  delegate_to: localhost
  become: false
  no_log: true
  register: lsa_submission
  when:
    - lsa_delivery_mode in ['upload', 'upload_and_keep']
    - lsa_signing_key_file | length > 0

- name: Record accepted upload
  ansible.builtin.copy:
    content: "{{ lsa_submission.json | to_nice_json }}"
    dest: "{{ lsa_output_root }}/{{ inventory_hostname }}/pending/submission.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - lsa_submission is not skipped
    - lsa_submission.status == 202
