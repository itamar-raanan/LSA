---
lsa_schema_version: "1.0"
lsa_scanner_version: "0.4.0"
lsa_delivery_mode: upload_and_keep
lsa_output_root: "{{ playbook_dir }}/../reports"
lsa_platform_url: "https://lsa.example.com"
lsa_ingest_token_file: "{{ lookup('env', 'HOME') }}/.lsa/token"
lsa_signing_key_file: ""
lsa_signing_key_id: ""
lsa_host_id: ""
lsa_profile: production_server
lsa_supported_profiles:
  - production_server
  - minimal_server
  - router
  - container
  - level1_server
  - level2_server
  - level1_workstation
  - level2_workstation
lsa_cis_profile_map:
  production_server: level2_server
  minimal_server: level1_server
  router: level2_server
  container: level1_server
  level1_server: level1_server
  level2_server: level2_server
  level1_workstation: level1_workstation
  level2_workstation: level2_workstation
lsa_cis_exceptions: {}
lsa_security_health_exceptions: {}
lsa_security_health_stale_account_days: 90
lsa_modules:
  - cis
  - security_health
lsa_findings: []
lsa_summary:
  pass: 0
  fail: 0
  manual: 0
  not_applicable: 0
  error: 0
