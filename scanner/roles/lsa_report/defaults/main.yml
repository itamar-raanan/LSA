---
lsa_schema_version: "1.0"
lsa_scanner_version: "0.6.0"
lsa_collect_application_inventory: true
lsa_controller_python: "{{ ansible_playbook_python }}"
lsa_delivery_mode: upload_and_keep
lsa_output_root: "{{ playbook_dir }}/../reports"
lsa_platform_url: "https://lsa.example.com"
lsa_validate_certs: true
lsa_ingest_token_file: "{{ lookup('env', 'HOME') }}/.lsa/token"
lsa_signing_key_file: ""
lsa_signing_key_id: ""
lsa_host_id: ""
lsa_profile: production_server
lsa_supported_profiles:
  - production_server
  - minimal_server
  - router
  - container
  - level1_server
  - level2_server
  - level1_workstation
  - level2_workstation
lsa_cis_profile_map:
  production_server: level2_server
  minimal_server: level1_server
  router: level2_server
  container: level1_server
  level1_server: level1_server
  level2_server: level2_server
  level1_workstation: level1_workstation
  level2_workstation: level2_workstation
lsa_cis_exceptions: {}
lsa_security_health_exceptions: {}
lsa_security_health_stale_account_days: 90
lsa_policy_default_mode: audit
lsa_policy_control_modes: {}
lsa_canonical_categories:
  - accounts
  - audit
  - filesystem
  - kernel
  - logging
  - mandatory_access
  - network
  - packages
  - services
  - ssh
  - time
  - updates
lsa_supported_systems:
  Debian: ['12', '13']
  Ubuntu: ['22.04', '24.04']
  RedHat: ['8', '9']
  Rocky: ['8', '9']
  AlmaLinux: ['8', '9']
  OracleLinux: ['8', '9']
  CentOS: ['8', '9']
lsa_modules:
  - cis
  - security_health
  - application_inventory
lsa_findings: []
lsa_applications: []
lsa_summary:
  pass: 0
  fail: 0
  manual: 0
  not_applicable: 0
  error: 0
