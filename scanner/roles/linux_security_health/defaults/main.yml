---
security_health_enabled: true
security_health_generate_standalone_reports: false
security_health_report_dir: "{{ playbook_dir }}/reports"
security_health_report_formats:
  - html
  - json
  - csv
security_health_stale_account_days: 90
security_health_max_evidence_lines: 250
security_health_exceptions: {}
security_health_policy_default_mode: audit
security_health_policy_control_modes: {}
security_health_results: []
security_health_active_benchmark: ""
security_health_canonical_categories:
  - accounts
  - audit
  - filesystem
  - kernel
  - logging
  - mandatory_access
  - network
  - packages
  - services
  - ssh
  - time
  - updates
