---
- name: Validate security health assessment settings
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - security_health_report_formats | difference(['html', 'json', 'csv']) | length == 0
    fail_msg: "Security health assessment requires Linux and supported report formats."
  when: security_health_enabled | bool

- name: Initialize security health results
  ansible.builtin.set_fact:
    security_health_results: []
  changed_when: false
  when: security_health_enabled | bool

- name: Load security health controls
  ansible.builtin.include_vars:
    file: controls.yml
  when: security_health_enabled | bool

- name: Load expanded Linux audit controls
  ansible.builtin.include_vars:
    file: expanded_controls.yml
  when: security_health_enabled | bool

- name: Assemble and validate portable Linux control catalog
  ansible.builtin.set_fact:
    security_health_catalog: "{{ security_health_controls + security_health_expanded_controls }}"
  changed_when: false
  when: security_health_enabled | bool

- name: Validate portable Linux control metadata
  ansible.builtin.assert:
    that:
      - security_health_catalog | map(attribute='id') | list | unique | length == security_health_catalog | length
      - security_health_catalog | map(attribute='semantic_key') | list | unique | length == security_health_catalog | length
      - security_health_catalog | map(attribute='category') | list | difference(security_health_canonical_categories) | length == 0
    fail_msg: Portable Linux controls must have unique IDs, unique semantic keys, and canonical categories.
  when: security_health_enabled | bool

- name: Run security health controls
  ansible.builtin.include_tasks: run_control.yml
  loop: "{{ security_health_catalog }}"
  loop_control:
    loop_var: health_control
    label: "{{ health_control.id }} {{ health_control.title }}"
  when:
    - security_health_enabled | bool
    - security_health_active_benchmark not in (health_control.superseded_by | default([]))
    - security_health_policy_control_modes.get('LSA-HEALTH-' ~ health_control.id, security_health_policy_default_mode) != 'disabled'

- name: Generate security health reports
  ansible.builtin.include_tasks: report.yml
  when:
    - security_health_enabled | bool
    - security_health_generate_standalone_reports | bool
