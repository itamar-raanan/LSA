  - {id: '1.1.2.1.2', title: 'Ensure nodev option set on /tmp partition', mount: '/tmp', check: 'option', option: 'nodev', profiles: [level1_server, level2_server, level1_workstation, level2_workstation]}
  - {id: '1.1.2.1.3', title: 'Ensure nosuid option set on /tmp partition', mount: '/tmp', check: 'option', option: 'nosuid', profiles: [level1_server, level2_server, level1_workstation, level2_workstation]}
  - {id: '1.1.2.1.4', title: 'Ensure noexec option set on /tmp partition', mount: '/tmp', check: 'option', option: 'noexec', profiles: [level1_server, level2_server, level1_workstation, level2_workstation]}
