cis_ssh_server_controls:
- id: 5.1.1
  title: Ensure access to /etc/ssh/sshd_config is configured
  profiles: &id001
  - level1_server
  - level1_workstation
  - level2_server
  - level2_workstation
  expected: sshd_config and included .conf files are root:root and mode 0600 or more restrictive
  audit: 'if ! dpkg-query -W -f=''${Status}'' openssh-server 2>/dev/null | grep -q ''install ok installed''; then echo ''openssh-server not installed''; exit 3; fi

    bad=0

    check(){ f="$1"; [ -e "$f" ] || return; read -r mode uid gid < <(stat -Lc ''%a %u %g'' "$f"); echo "$f mode=$mode uid=$uid gid=$gid"; (( (8#$mode & 0077) == 0 )) && [ "$uid" = 0 ] && [ "$gid" = 0 ] || bad=1; }

    check /etc/ssh/sshd_config

    while IFS= read -r -d '''' f; do check "$f"; done < <(find /etc/ssh/sshd_config.d -xdev -type f -name ''*.conf'' -print0 2>/dev/null)

    exit "$bad"

    '
- id: 5.1.2
  title: Ensure access to SSH private host key files is configured
  profiles: *id001
  expected: Private SSH host keys are root:root mode 0600
  audit: 'sshd_bin="$(command -v sshd || true)"; keygen="$(command -v ssh-keygen || true)"

    [ -n "$sshd_bin" ] && [ -n "$keygen" ] || { echo ''openssh-server not installed''; exit 3; }

    bad=0; count=0

    while read -r f; do [ -n "$f" ] || continue; if "$keygen" -lf "$f" >/dev/null 2>&1; then count=$((count+1)); read -r mode uid gid < <(stat -Lc ''%a %u %g'' "$f"); echo "$f mode=$mode uid=$uid gid=$gid"; [ "$mode" = 600 ] && [ "$uid" = 0 ] && [ "$gid" = 0 ] || bad=1; fi; done < <("$sshd_bin" -T 2>/dev/null | awk ''$1=="hostkey"{print $2}'')

    [ "$count" -gt 0 ] || { echo ''no private host keys found''; exit 2; }; exit "$bad"

    '
- id: 5.1.3
  title: Ensure access to SSH public host key files is configured
  profiles: *id001
  expected: Public SSH host keys are root:root mode 0644 or more restrictive
  audit: 'sshd_bin="$(command -v sshd || true)"; keygen="$(command -v ssh-keygen || true)"

    [ -n "$sshd_bin" ] && [ -n "$keygen" ] || { echo ''openssh-server not installed''; exit 3; }

    bad=0; count=0

    while read -r f; do f="${f}.pub"; [ -f "$f" ] || continue; if "$keygen" -lf "$f" >/dev/null 2>&1; then count=$((count+1)); read -r mode uid gid < <(stat -Lc ''%a %u %g'' "$f"); echo "$f mode=$mode uid=$uid gid=$gid"; (( (8#$mode & 0133) == 0 )) && [ "$uid" = 0 ] && [ "$gid" = 0 ] || bad=1; fi; done < <("$sshd_bin" -T 2>/dev/null | awk ''$1=="hostkey"{print $2}'')

    [ "$count" -gt 0 ] || { echo ''no public host keys found''; exit 2; }; exit "$bad"

    '
- id: 5.1.4
  title: Ensure sshd access is configured
  profiles: *id001
  expected: At least one AllowUsers, AllowGroups, DenyUsers, or DenyGroups rule is configured
  audit: 'sshd_bin="$(command -v sshd || true)"

    if [ -z "$sshd_bin" ]; then echo "openssh-server not installed"; exit 3; fi

    cfg="$($sshd_bin -T 2>&1)" || { echo "$cfg"; exit 2; }

    printf ''%s\n'' "$cfg" | grep -Pi ''^\s*(allow|deny)(users|groups)\s+\S+'' && exit 0

    echo ''No SSH access restriction found''; exit 1

    '
- id: 5.1.5
  title: Ensure sshd Banner is configured
  profiles: *id001
  expected: Banner points to an existing policy file without OS disclosure tokens
  audit: 'sshd_bin="$(command -v sshd || true)"

    if [ -z "$sshd_bin" ]; then echo "openssh-server not installed"; exit 3; fi

    cfg="$($sshd_bin -T 2>&1)" || { echo "$cfg"; exit 2; }

    banner="$(printf ''%s\n'' "$cfg"|awk ''$1=="banner"{print $2;exit}'')"; echo "banner=$banner"

    [ -n "$banner" ] && [ "$banner" != none ] && [ -f "$banner" ] || exit 1

    osid="$(awk -F= ''$1=="ID"{gsub(/"/,"",$2);print $2}'' /etc/os-release 2>/dev/null)"

    grep -Pqi "(\\\\v|\\\\r|\\\\m|\\\\s|\\b${osid}\\b)" "$banner" && exit 1

    cat "$banner"; exit 0

    '
- id: 5.1.6
  title: Ensure sshd Ciphers are configured
  profiles: *id001
  expected: No weak CBC, 3DES, Blowfish, CAST, ARCFOUR, or rijndael-cbc ciphers
  audit: 'sshd_bin="$(command -v sshd || true)"

    if [ -z "$sshd_bin" ]; then echo "openssh-server not installed"; exit 3; fi

    cfg="$($sshd_bin -T 2>&1)" || { echo "$cfg"; exit 2; }

    v="$(printf ''%s\n'' "$cfg"|awk ''$1=="ciphers"{print $2;exit}'')"; echo "ciphers=$v"

    printf ''%s'' "$v" | grep -Pqi ''(3des|blowfish|cast128|aes(128|192|256)-cbc|arcfour(128|256)?|rijndael-cbc@lysator\.liu\.se)'' && exit 1 || exit 0

    '
