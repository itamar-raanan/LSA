- id: 5.1.13
  title: Ensure sshd post-quantum cryptography key exchange algorithms are configured
  profiles: *id001
  expected: sntrup761x25519-sha512 is present; OpenSSH 9.9+ also has mlkem768x25519-sha256
  audit: 'sshd_bin="$(command -v sshd || true)"

    if [ -z "$sshd_bin" ]; then echo "openssh-server not installed"; exit 3; fi

    cfg="$($sshd_bin -T 2>&1)" || { echo "$cfg"; exit 2; }

    v="$(printf ''%s\n'' "$cfg"|awk ''$1=="kexalgorithms"{print $2;exit}'')"; ver="$($sshd_bin -V 2>&1|grep -Po ''OpenSSH_\K[0-9]+\.[0-9]+''|head -1)"; echo "version=$ver kexalgorithms=$v"; printf ''%s'' "$v"|grep -q ''sntrup761x25519-sha512'' || exit 1

    major=${ver%%.*}; minor=${ver#*.}; if [ "$major" -gt 9 ] || { [ "$major" -eq 9 ] && [ "$minor" -ge 9 ]; }; then printf ''%s'' "$v"|grep -q ''mlkem768x25519-sha256'' || exit 1; fi; exit 0

    '
