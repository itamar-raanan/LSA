  title: Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
  profiles: *id001
  expected: ClientAliveInterval and ClientAliveCountMax are greater than zero
  audit: 'sshd_bin="$(command -v sshd || true)"

    if [ -z "$sshd_bin" ]; then echo "openssh-server not installed"; exit 3; fi

    cfg="$($sshd_bin -T 2>&1)" || { echo "$cfg"; exit 2; }

    i="$(printf ''%s\n'' "$cfg"|awk ''$1=="clientaliveinterval"{print $2;exit}'')"; c="$(printf ''%s\n'' "$cfg"|awk ''$1=="clientalivecountmax"{print $2;exit}'')"; echo "clientaliveinterval=$i clientalivecountmax=$c"; [ "$i" -gt 0 ] 2>/dev/null && [ "$c" -gt 0 ] 2>/dev/null

    '
