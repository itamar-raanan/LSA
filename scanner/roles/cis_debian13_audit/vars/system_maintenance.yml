- id: 7.1.11
  title: Ensure world writable files and directories are secured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    badf=$(find / -xdev -type f -perm -0002 -printf '%m %p\n' 2>/dev/null)
    badd=$(find / -xdev -type d -perm -0002 ! -perm -1000 -printf '%m %p\n' 2>/dev/null)
    [ -z "$badf$badd" ] || { echo "$badf"; echo "$badd"; exit 1; }
    echo 'World-writable objects secured'
- id: 7.1.12
  title: Ensure no files or directories without an owner and a group exist
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(find / -xdev \( -nouser -o -nogroup \) -printf '%u %g %p\n' 2>/dev/null)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'No unowned/ungrouped objects'
- id: 7.2.1
  title: Ensure accounts in /etc/passwd use shadowed passwords
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(awk -F: '$2 != "x" {print $1 ":" $2}' /etc/passwd)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'All accounts use shadowed passwords'
- id: 7.2.2
  title: Ensure /etc/shadow password fields are not empty
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(awk -F: '$2 == "" {print $1}' /etc/shadow)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'No empty shadow passwords'
- id: 7.2.3
  title: Ensure all groups in /etc/passwd exist in /etc/group
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(awk -F: 'NR==FNR{g[$3]=1;next}!($4 in g){print $1 ":" $4}' /etc/group /etc/passwd)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'All primary groups exist'
- id: 7.2.4
  title: Ensure shadow group is empty
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    m=$(getent group shadow | cut -d: -f4)
    p=$(awk -F: '$4==42{print $1}' /etc/passwd)
    [ -z "$m$p" ] || { echo "members=$m primary=$p"; exit 1; }
    echo 'shadow group empty'
