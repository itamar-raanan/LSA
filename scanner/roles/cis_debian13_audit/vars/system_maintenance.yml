---
cis_section7_controls:
- id: 7.1.1
  title: Ensure access to /etc/passwd is configured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    [ -e /etc/passwd ] || { echo '/etc/passwd missing'; exit 1; }
    read mode uid gid <<EOF
    $(stat -Lc '%a %u %g' /etc/passwd)
    EOF
    [ $((8#$mode & 8#0133)) -eq 0 ] || { echo "mode=$mode"; exit 1; }
    [ "$uid" = 0 ] || { echo "uid=$uid"; exit 1; }
    [ "$gid" = 0 ] || { echo "gid=$gid"; exit 1; }
    stat -Lc '%a %U %G %n' /etc/passwd
