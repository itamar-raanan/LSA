  - id: "2.1.22"
    title: "Ensure mail transfer agents are configured for local-only mode"
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: SMTP ports 25, 465, and 587 do not listen on non-loopback interfaces.
    audit: !unsafe |
      bad=0
      for port in 25 465 587; do
        listeners="$(ss -H -lntu 2>/dev/null | awk -v p=":${port}" '$5 ~ p"$" {print $5}')"
        while IFS= read -r endpoint; do
          [ -z "$endpoint" ] && continue
          case "$endpoint" in
            127.0.0.1:*|\[::1\]:*|::1:*) echo "PASS: $endpoint" ;;
            *) echo "FAIL: port $port listens on $endpoint"; bad=1 ;;
          esac
        done <<< "$listeners"
      done
      [ "$bad" -eq 0 ]

  - id: "2.1.23"
    title: "Ensure only approved services are listening on a network interface"
    assessment: Manual
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: Every listening service, port, protocol, and interface is approved by local site policy.
    guidance: Run ss -plntu and review every listener against the approved-service inventory.
