---
cis_server_service_controls:
  - id: "2.1.1"
    title: "Ensure autofs services are not in use"
    assessment: Automated
    profiles: [level1_server, level2_server, level2_workstation]
    expected: The package is absent, or every associated service and socket is disabled and inactive.
    audit: !unsafe |
      installed=()
      if dpkg-query -W -f='${Status}' autofs 2>/dev/null | grep -q '^install ok installed$'; then installed+=("autofs"); fi
      if [ "${#installed[@]}" -eq 0 ]; then
        echo "PASS: packages are not installed"
        exit 0
      fi
      bad=0
      echo "Installed packages: ${installed[*]}"
      enabled="$(systemctl is-enabled autofs.service 2>/dev/null || true)"
      active="$(systemctl is-active autofs.service 2>/dev/null || true)"
      echo "autofs.service: enabled=${enabled:-unknown} active=${active:-unknown}"
      if [ "$enabled" = "enabled" ] || [ "$active" = "active" ]; then bad=1; fi
      [ "$bad" -eq 0 ]

