---
cis_pam_profiles: &all_profiles
  - level1_server
  - level1_workstation
  - level2_server
  - level2_workstation

cis_pam_controls:
  - id: "5.3.1.1"
    title: Ensure latest version of pam is installed
    profiles: *all_profiles
    expected: libpam-runtime is installed and is not listed as upgradable
    audit: !unsafe |
      dpkg-query -W -f='${Status}\n' libpam-runtime 2>/dev/null | grep -q '^install ok installed$' || { echo 'libpam-runtime is not installed'; exit 1; }
      upgrades="$(apt list --upgradable 2>/dev/null | grep -P '^libpam-runtime/' || true)"
      [ -z "$upgrades" ] || { printf '%s\n' "$upgrades"; exit 1; }
      echo 'libpam-runtime is installed and not listed as upgradable'

  - id: "5.3.1.2"
    title: Ensure latest version of libpam-modules is installed
    profiles: *all_profiles
    expected: libpam-modules is installed and is not listed as upgradable
    audit: !unsafe |
      dpkg-query -W -f='${Status}\n' libpam-modules 2>/dev/null | grep -q '^install ok installed$' || { echo 'libpam-modules is not installed'; exit 1; }
      upgrades="$(apt list --upgradable 2>/dev/null | grep -P '^libpam-modules/' || true)"
      [ -z "$upgrades" ] || { printf '%s\n' "$upgrades"; exit 1; }
      echo 'libpam-modules is installed and not listed as upgradable'

  - id: "5.3.1.3"
    title: Ensure latest version of libpam-pwquality is installed
    profiles: *all_profiles
    expected: libpam-pwquality is installed and is not listed as upgradable
    audit: !unsafe |
      dpkg-query -W -f='${Status}\n' libpam-pwquality 2>/dev/null | grep -q '^install ok installed$' || { echo 'libpam-pwquality is not installed'; exit 1; }
      upgrades="$(apt list --upgradable 2>/dev/null | grep -P '^libpam-pwquality/' || true)"
      [ -z "$upgrades" ] || { printf '%s\n' "$upgrades"; exit 1; }
      echo 'libpam-pwquality is installed and not listed as upgradable'

  - id: "5.3.2.1"
    title: Ensure pam_unix module is enabled
    profiles: *all_profiles
    expected: pam_unix.so is present in common-account, common-auth, common-password, and common-session
    audit: !unsafe |
      fail=0
      for file in common-account common-auth common-password common-session; do
        path="/etc/pam.d/$file"
        grep -Pqs '^\s*[^#].*\bpam_unix\.so\b' "$path" || { echo "$path: pam_unix.so missing"; fail=1; }
        grep -PHs '^\s*[^#].*\bpam_unix\.so\b' "$path" || true
      done
      exit "$fail"

  - id: "5.3.2.2"
    title: Ensure pam_faillock module is enabled
    profiles: *all_profiles
    expected: common-auth contains pam_faillock preauth and authfail entries, and common-account contains pam_faillock
    audit: !unsafe |
      auth=/etc/pam.d/common-auth
      account=/etc/pam.d/common-account
      fail=0
      grep -Pqs '^\s*auth\s+[^#]+\s+pam_faillock\.so\s+.*\bpreauth\b' "$auth" || { echo 'pam_faillock preauth missing'; fail=1; }
      grep -Pqs '^\s*auth\s+[^#]+\s+pam_faillock\.so\s+.*\bauthfail\b' "$auth" || { echo 'pam_faillock authfail missing'; fail=1; }
      grep -Pqs '^\s*account\s+[^#]+\s+pam_faillock\.so\b' "$account" || { echo 'pam_faillock account entry missing'; fail=1; }
      grep -PHs '\bpam_faillock\.so\b' "$auth" "$account" || true
      exit "$fail"

  - id: "5.3.2.3"
    title: Ensure pam_pwquality module is enabled
    profiles: *all_profiles
    expected: pam_pwquality.so is enabled in /etc/pam.d/common-password
    audit: !unsafe |
      grep -PH '^\s*password\s+[^#]+\s+pam_pwquality\.so\b' /etc/pam.d/common-password

  - id: "5.3.2.4"
    title: Ensure pam_pwhistory module is enabled
    profiles: *all_profiles
    expected: pam_pwhistory.so is enabled in /etc/pam.d/common-password
    audit: !unsafe |
      grep -PH '^\s*password\s+[^#]+\s+pam_pwhistory\.so\b' /etc/pam.d/common-password

  - id: "5.3.3.1.1"
    title: Ensure password failed attempts lockout is configured
    profiles: *all_profiles
    expected: Effective faillock deny value is between 1 and 5, and no PAM module override is 0 or greater than 5
    audit: !unsafe |
      conf="$(grep -Psi '^\s*deny\s*=\s*[0-9]+\b' /etc/security/faillock.conf 2>/dev/null | tail -1 || true)"
      value="$(printf '%s' "$conf" | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*auth\s+[^#]+\s+pam_faillock\.so\s+.*\bdeny\s*=\s*(0|[6-9]|[1-9][0-9]+)\b' /etc/pam.d/common-auth 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && [ "$value" -ge 1 ] && [ "$value" -le 5 ] || { echo "Invalid or missing deny value: ${value:-unset}"; exit 1; }
      echo "$conf"

  - id: "5.3.3.1.2"
    title: Ensure password unlock time is configured
    profiles: *all_profiles
    expected: Effective unlock_time is 0 or at least 900 seconds, with no PAM override between 1 and 899
    audit: !unsafe |
      conf="$(grep -Psi '^\s*unlock_time\s*=\s*[0-9]+\b' /etc/security/faillock.conf 2>/dev/null | tail -1 || true)"
      value="$(printf '%s' "$conf" | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*auth\s+[^#]+\s+pam_faillock\.so\s+.*\bunlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b' /etc/pam.d/common-auth 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && { [ "$value" -eq 0 ] || [ "$value" -ge 900 ]; } || { echo "Invalid or missing unlock_time: ${value:-unset}"; exit 1; }
      echo "$conf"

  - id: "5.3.3.1.3"
    title: Ensure password failed attempts lockout includes root account
    profiles: *all_profiles
    expected: even_deny_root is enabled; if root_unlock_time is set it is 60 seconds or more
    audit: !unsafe |
      grep -Pqs '^\s*even_deny_root\b' /etc/security/faillock.conf || { echo 'even_deny_root is missing'; exit 1; }
      value="$(grep -Psi '^\s*root_unlock_time\s*=\s*[0-9]+\b' /etc/security/faillock.conf 2>/dev/null | tail -1 | grep -Po '[0-9]+' | tail -1 || true)"
      [ -z "$value" ] || [ "$value" -ge 60 ] || { echo "root_unlock_time is less than 60: $value"; exit 1; }
      bad="$(grep -PHsi '^\s*auth\s+[^#]+\s+pam_faillock\.so\s+.*\broot_unlock_time\s*=\s*([1-9]|[1-5][0-9])\b' /etc/pam.d/common-auth 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      grep -PHs '^\s*(even_deny_root|root_unlock_time\s*=)' /etc/security/faillock.conf || true

  - id: "5.3.3.2.1"
    title: Ensure password number of changed characters is configured
    profiles: *all_profiles
    expected: Effective difok is 2 or more and no common-password module override is less than 2
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
      value="$(grep -Phsi '^\s*difok\s*=\s*[0-9]+\b' "${files[@]}" 2>/dev/null | tail -1 | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*password\s+[^#]+\s+pam_pwquality\.so\s+.*\bdifok\s*=\s*[01]\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && [ "$value" -ge 2 ] || { echo "difok is invalid or missing: ${value:-unset}"; exit 1; }
      grep -PHsi '^\s*difok\s*=' "${files[@]}" 2>/dev/null || true

  - id: "5.3.3.2.2"
    title: Ensure password length is configured
    profiles: *all_profiles
    expected: Effective minlen is 14 or more and no common-password module override is less than 14
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
      value="$(grep -Phsi '^\s*minlen\s*=\s*[0-9]+\b' "${files[@]}" 2>/dev/null | tail -1 | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*password\s+[^#]+\s+pam_pwquality\.so\s+.*\bminlen\s*=\s*([0-9]|1[0-3])\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && [ "$value" -ge 14 ] || { echo "minlen is invalid or missing: ${value:-unset}"; exit 1; }
      grep -PHsi '^\s*minlen\s*=' "${files[@]}" 2>/dev/null || true

  - id: "5.3.3.2.4"
    title: Ensure password same consecutive characters is configured
    profiles: *all_profiles
    expected: Effective maxrepeat is between 1 and 3 and no module override is 0 or greater than 3
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
      value="$(grep -Phsi '^\s*maxrepeat\s*=\s*[0-9]+\b' "${files[@]}" 2>/dev/null | tail -1 | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*password\s+[^#]+\s+pam_pwquality\.so\s+.*\bmaxrepeat\s*=\s*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && [ "$value" -ge 1 ] && [ "$value" -le 3 ] || { echo "maxrepeat is invalid or missing: ${value:-unset}"; exit 1; }
      grep -PHsi '^\s*maxrepeat\s*=' "${files[@]}" 2>/dev/null || true

  - id: "5.3.3.2.5"
    title: Ensure password maximum sequential characters is configured
    profiles: *all_profiles
    expected: Effective maxsequence is between 1 and 3 and no module override is 0 or greater than 3
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
      value="$(grep -Phsi '^\s*maxsequence\s*=\s*[0-9]+\b' "${files[@]}" 2>/dev/null | tail -1 | grep -Po '[0-9]+' | tail -1 || true)"
      bad="$(grep -PHsi '^\s*password\s+[^#]+\s+pam_pwquality\.so\s+.*\bmaxsequence\s*=\s*(0|[4-9]|[1-9][0-9]+)\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      [ -n "$value" ] && [ "$value" -ge 1 ] && [ "$value" -le 3 ] || { echo "maxsequence is invalid or missing: ${value:-unset}"; exit 1; }
      grep -PHsi '^\s*maxsequence\s*=' "${files[@]}" 2>/dev/null || true

  - id: "5.3.3.2.6"
    title: Ensure password dictionary check is enabled
    profiles: *all_profiles
    expected: dictcheck is not disabled in pwquality configuration or the PAM module
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf)
      bad="$(grep -PHsi '^\s*dictcheck\s*=\s*0\b' "${files[@]}" /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      echo 'dictcheck is enabled by default or explicitly configured'

  - id: "5.3.3.2.7"
    title: Ensure password quality checking is enforced
    profiles: *all_profiles
    expected: enforcing=0 is not configured in pwquality files or on pam_pwquality
    audit: !unsafe |
      files=(/etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf /etc/pam.d/common-password)
      bad="$(grep -PHsi '^\s*(enforcing\s*=\s*0\b|password\s+[^#]+\s+pam_pwquality\.so\s+.*\benforcing\s*=\s*0\b)' "${files[@]}" 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      echo 'password quality enforcement is not disabled'

  - id: "5.3.3.2.8"
    title: Ensure password quality is enforced for the root user
    profiles: *all_profiles
    expected: enforce_for_root is enabled in effective pwquality configuration
    audit: !unsafe |
      grep -PHsi '^\s*enforce_for_root\b' /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf 2>/dev/null | tail -1 | grep .

  - id: "5.3.3.3.1"
    title: Ensure password history remember is configured
    profiles: *all_profiles
    expected: remember is configured using exactly one method and is 24 or more
    audit: !unsafe |
      conf="$(grep -Psi '^\s*remember\s*=\s*[0-9]+\b' /etc/security/pwhistory.conf 2>/dev/null | tail -1 || true)"
      pam="$(grep -Psi '^\s*password\s+[^#]+\s+pam_pwhistory\.so\s+.*\bremember\s*=\s*[0-9]+\b' /etc/pam.d/common-password 2>/dev/null | tail -1 || true)"
      [ -z "$conf" ] || [ -z "$pam" ] || { echo 'remember is configured in both pwhistory.conf and common-password'; exit 1; }
      line="${conf:-$pam}"
      value="$(printf '%s' "$line" | grep -Po 'remember\s*=\s*\K[0-9]+' | tail -1 || true)"
      [ -n "$value" ] && [ "$value" -ge 24 ] || { echo "remember is invalid or missing: ${value:-unset}"; exit 1; }
      echo "$line"

  - id: "5.3.3.3.2"
    title: Ensure password history is enforced for the root user
    profiles: *all_profiles
    expected: enforce_for_root is configured using exactly one pwhistory configuration method
    audit: !unsafe |
      conf="$(grep -Psi '^\s*enforce_for_root\b' /etc/security/pwhistory.conf 2>/dev/null || true)"
      pam="$(grep -Psi '^\s*password\s+[^#]+\s+pam_pwhistory\.so\s+.*\benforce_for_root\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$conf" ] || [ -z "$pam" ] || { echo 'enforce_for_root is configured in both locations'; exit 1; }
      [ -n "$conf" ] || [ -n "$pam" ] || { echo 'enforce_for_root is missing'; exit 1; }
      printf '%s\n%s\n' "$conf" "$pam" | sed '/^$/d'

  - id: "5.3.3.3.3"
    title: Ensure pam_pwhistory includes use_authtok
    profiles: *all_profiles
    expected: use_authtok is configured using exactly one pwhistory configuration method
    audit: !unsafe |
      conf="$(grep -Psi '^\s*use_authtok\b' /etc/security/pwhistory.conf 2>/dev/null || true)"
      pam="$(grep -Psi '^\s*password\s+[^#]+\s+pam_pwhistory\.so\s+.*\buse_authtok\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -z "$conf" ] || [ -z "$pam" ] || { echo 'use_authtok is configured in both locations'; exit 1; }
      [ -n "$conf" ] || [ -n "$pam" ] || { echo 'use_authtok is missing'; exit 1; }
      printf '%s\n%s\n' "$conf" "$pam" | sed '/^$/d'

  - id: "5.3.3.4.1"
    title: Ensure pam_unix does not include nullok
    profiles: *all_profiles
    expected: No active pam_unix.so entry includes nullok
    audit: !unsafe |
      bad="$(grep -PHs '^\s*[^#]+\s+pam_unix\.so\s+.*\bnullok\b' /etc/pam.d/common-{password,auth,account,session,session-noninteractive} 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      echo 'No pam_unix nullok arguments found'

  - id: "5.3.3.4.2"
    title: Ensure pam_unix does not include remember
    profiles: *all_profiles
    expected: No active pam_unix.so entry includes remember
    audit: !unsafe |
      bad="$(grep -PHs '^\s*[^#]+\s+pam_unix\.so\s+.*\bremember\s*=\s*[0-9]+\b' /etc/pam.d/common-{password,auth,account,session,session-noninteractive} 2>/dev/null || true)"
      [ -z "$bad" ] || { printf '%s\n' "$bad"; exit 1; }
      echo 'No pam_unix remember arguments found'

  - id: "5.3.3.4.3"
    title: Ensure pam_unix includes a strong password hashing algorithm
    profiles: *all_profiles
    expected: Every active password pam_unix.so entry includes yescrypt or sha512
    audit: !unsafe |
      lines="$(grep -PHs '^\s*password\s+[^#]+\s+pam_unix\.so\b' /etc/pam.d/common-password 2>/dev/null || true)"
      [ -n "$lines" ] || { echo 'No password pam_unix.so line found'; exit 1; }
      bad="$(printf '%s\n' "$lines" | grep -Pv '\b(yescrypt|sha512)\b' || true)"
      [ -z "$bad" ] || { printf 'Weak entries:\n%s\n' "$bad"; exit 1; }
      printf '%s\n' "$lines"

  - id: "5.3.3.4.4"
    title: Ensure pam_unix includes use_authtok
    profiles: *all_profiles
    expected: Active Password pam_unix.so entry includes use_authtok
    audit: !unsafe |
      grep -PH '^\s*password\s+[^#]+\s+pam_unix\.so\s+.*\buse_authtok\b' /etc/pam.d/common-password

cis_pam_manual_controls:
  - id: "5.3.3.2.3"
    title: Ensure password complexity is configured
    profiles: *all_profiles
    expected: Password complexity meets local policy using minclass or non-positive dcredit, ucredit, lcredit, and ocredit values, with no positive credit overrides
    guidance: Review effective pwquality minclass and character-class credit settings in /etc/security/pwquality.conf, /etc/security/pwquality.conf.d/*.conf, and pam_pwquality arguments. Confirm the selected combination meets local site policy and that no credit value greater than zero weakens the requirement.
