---
cis_network_device_controls:
  - id: '3.1.1'
    title: Ensure IPv6 status is identified
    assessment: Manual
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: IPv6 status is identified and documented in accordance with local site policy
    guidance: Review /sys/module/ipv6/parameters/disable and net.ipv6.conf.*.disable_ipv6; document whether IPv6 is enabled or disabled.

  - id: '3.1.2'
    title: Ensure wireless interfaces are not available
    assessment: Automated
    profiles: [level1_server, level2_server]
    expected: No wireless interface exists, or every associated driver module is unloaded, deny-listed, and not loadable
    audit: !unsafe |
      mapfile -t modules < <(
        find /sys/class/net -type d -path '*/wireless' -print0 2>/dev/null |
        while IFS= read -r -d '' wireless; do
          driver="$(readlink -f "$(dirname "$wireless")/device/driver/module" 2>/dev/null || true)"
          [[ -n "$driver" ]] && basename "$driver"
        done | sort -u
      )
      if ((${#modules[@]} == 0)); then
        echo 'No wireless interfaces detected'
        exit 0
      fi
      failed=0
      for module in "${modules[@]}"; do
        loadable="$(modprobe -n -v "$module" 2>/dev/null || true)"
        loaded=0; lsmod | awk '{print $1}' | grep -qx "$module" && loaded=1
        denylisted=0; modprobe --showconfig 2>/dev/null | grep -Pq "^[[:space:]]*blacklist[[:space:]]+$module\\b" && denylisted=1
        blocked=0; grep -Pq '^[[:space:]]*install[[:space:]]+/bin/(true|false)' <<< "$loadable" && blocked=1
        printf 'module=%s loaded=%s denylisted=%s blocked=%s load_rule=%s\n' "$module" "$loaded" "$denylisted" "$blocked" "$loadable"
        [[ "$loaded" == 0 && "$denylisted" == 1 && "$blocked" == 1 ]] || failed=1
      done
      exit "$failed"

  - id: '3.1.3'
    title: Ensure bluetooth services are not in use
    assessment: Automated
    profiles: [level1_server, level2_server, level2_workstation]
    expected: bluez is absent, or bluetooth.service is disabled/masked and inactive
    audit: !unsafe |
      if ! dpkg-query -W -f='${db:Status-Status}\n' bluez 2>/dev/null | grep -qx installed; then
        echo 'bluez package is not installed'
        exit 0
      fi
      enabled="$(systemctl is-enabled bluetooth.service 2>/dev/null || true)"
      active="$(systemctl is-active bluetooth.service 2>/dev/null || true)"
      printf 'package=bluez installed\nservice_enabled=%s\nservice_active=%s\n' "$enabled" "$active"
      [[ "$enabled" =~ ^(disabled|masked|not-found)$ && "$active" != active ]]
