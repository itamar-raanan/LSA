  - id: "1.6.4"
    title: Ensure access to /etc/motd is configured
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: If /etc/motd exists, its resolved target is owned by root:root and mode is 0644 or more restrictive
    audit: !unsafe |
      if [ ! -e /etc/motd ]; then
        echo "PASS: /etc/motd does not exist"
        exit 0
      fi
      target="$(readlink -e /etc/motd)" || { echo "ERROR: cannot resolve /etc/motd"; exit 2; }
      read -r mode uid gid < <(stat -Lc '%a %u %g' "$target") || exit 2
      mode_value=$((8#$mode))
      if [ "$uid" -eq 0 ] && [ "$gid" -eq 0 ] && [ $((mode_value & 8#133)) -eq 0 ]; then
        echo "PASS: target=$target mode=$mode uid=$uid gid=$gid"
        exit 0
      fi
      echo "FAIL: target=$target mode=$mode uid=$uid gid=$gid"
      exit 1

