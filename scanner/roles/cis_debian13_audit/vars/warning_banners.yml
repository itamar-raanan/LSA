---
cis_warning_banner_controls:
  - id: "1.6.1"
    title: Ensure /etc/motd is configured
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: MOTD content contains no OS-identifying escape sequences or operating-system name; remaining content must follow local policy
    audit: !unsafe |
      os_id="$(awk -F= '$1 == "ID" {gsub(/\"/, "", $2); print $2}' /etc/os-release 2>/dev/null)"
      found=0
      reviewed=0
      shopt -s nullglob
      files=(/etc/motd /etc/motd.d/*)
      for file in "${files[@]}"; do
        [ -f "$file" ] || continue
        [ -s "$file" ] && reviewed=$((reviewed + 1))
        if grep -Pqsi -- "(\\\\v|\\\\r|\\\\m|\\\\s${os_id:+|\\b${os_id}\\b})" "$file"; then
          echo "FAIL: $file includes system information"
          found=1
        else
          echo "REVIEW: $file contains no detected system information; verify site-policy wording"
        fi
      done
      if [ "$found" -ne 0 ]; then exit 1; fi
      if [ "$reviewed" -eq 0 ]; then
        echo "PASS: no non-empty MOTD files found; verify that this follows local policy"
      else
        echo "PASS: no MOTD file exposes detected system information"
      fi
      exit 0

  - id: "1.6.2"
    title: Ensure /etc/issue is configured
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: /etc/issue exists, contains no OS-identifying escape sequences or operating-system name, and follows local policy
    audit: !unsafe |
      [ -f /etc/issue ] || { echo "FAIL: /etc/issue does not exist"; exit 1; }
      os_id="$(awk -F= '$1 == "ID" {gsub(/\"/, "", $2); print $2}' /etc/os-release 2>/dev/null)"
      if grep -Pqsi -- "(\\\\v|\\\\r|\\\\m|\\\\s${os_id:+|\\b${os_id}\\b})" /etc/issue; then
        echo "FAIL: /etc/issue includes system information"
        exit 1
      fi
      echo "PASS: no detected system information; verify banner text follows local policy"
      cat /etc/issue
      exit 0

