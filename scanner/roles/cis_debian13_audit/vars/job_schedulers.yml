  - id: "2.4.1.9"
    title: "Ensure access to crontab is configured"
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: If cron is installed, /etc/cron.allow exists with root ownership and restrictive permissions, and /etc/cron.deny is absent.
    audit: !unsafe |
      if ! dpkg-query -W -f='${Status}' cron 2>/dev/null | grep -q '^install ok installed$'; then exit 3; fi
      fail=0
      if [ ! -f /etc/cron.allow ]; then echo "/etc/cron.allow is missing"; fail=1; else
        stat -Lc 'path=%n mode=%a uid=%u gid=%g group=%G' /etc/cron.allow
        mode=$(stat -Lc '%a' /etc/cron.allow); uid=$(stat -Lc '%u' /etc/cron.allow); gidname=$(stat -Lc '%G' /etc/cron.allow)
        [ "$uid" -eq 0 ] || fail=1
        case "$gidname" in root|crontab) :;; *) fail=1;; esac
        [ $((8#$mode & 0133)) -eq 0 ] || fail=1
      fi
      if [ -e /etc/cron.deny ]; then echo "/etc/cron.deny exists"; fail=1; fi
      exit "$fail"

