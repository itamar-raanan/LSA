---
cis_job_scheduler_controls:
  - id: "2.4.1.1"
    title: "Ensure cron daemon is enabled and active"
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: If cron is installed, its service is enabled and active.
    audit: !unsafe |
      if ! dpkg-query -W -f='${Status}' cron 2>/dev/null | grep -q '^install ok installed$'; then
        echo "cron is not installed; cron subsection is not applicable"
        exit 3
      fi
      unit="$(systemctl list-unit-files --type=service 2>/dev/null | awk '$1 ~ /^crond?\.service$/ {print $1; exit}')"
      [ -n "$unit" ] || { echo "cron service unit not found"; exit 1; }
      enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
      active="$(systemctl is-active "$unit" 2>/dev/null || true)"
      echo "$unit enabled=$enabled active=$active"
      case "$enabled" in enabled|enabled-runtime) :;; *) exit 1;; esac
      [ "$active" = active ]

  - id: "2.4.1.2"
    title: "Ensure access to /etc/crontab is configured"
    assessment: Automated
    profiles: [level1_server, level2_server, level1_workstation, level2_workstation]
    expected: If cron is installed, /etc/crontab is owned by root:root and mode 0600 or more restrictive.
    audit: !unsafe |
      if ! dpkg-query -W -f='${Status}' cron 2>/dev/null | grep -q '^install ok installed$'; then exit 3; fi
      [ -e /etc/crontab ] || { echo "/etc/crontab is missing"; exit 1; }
      stat -Lc 'path=%n mode=%a uid=%u gid=%g' /etc/crontab
      mode=$(stat -Lc '%a' /etc/crontab); uid=$(stat -Lc '%u' /etc/crontab); gid=$(stat -Lc '%g' /etc/crontab)
      [ "$uid" -eq 0 ] && [ "$gid" -eq 0 ] && [ $((8#$mode & 0177)) -eq 0 ]

