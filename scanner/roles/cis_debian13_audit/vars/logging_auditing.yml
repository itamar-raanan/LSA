    dpkg-query -W -f='rsyslog-gnutls=${Version}\n' rsyslog-gnutls
- id: 6.1.2.10
  title: Ensure rsyslog forwarding uses gtls
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    cfg=$(cat /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null)
    grep -Pqi 'gtls' <<<"$cfg" || { echo 'gtls not configured'; exit 1; }
    grep -Pqi 'StreamDriverMode[="[:space:]]+1|StreamDriverAuthMode' <<<"$cfg" || { echo 'gtls mode/auth missing'; exit 1; }
    echo 'rsyslog forwarding uses gtls'
- id: 6.1.3.1
  title: Ensure access to all logfiles has been configured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(find /var/log -xdev -type f -perm /0037 -printf '%m %U %G %p\n' 2>/dev/null)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'Log files are 0640 or more restrictive'
- id: 6.2.1.1
  title: Ensure auditd packages are installed
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    fail=0
    for p in auditd audispd-plugins; do dpkg-query -W -f='${db:Status-Status}\n' "$p" 2>/dev/null | grep -qx installed || { echo "$p missing"; fail=1; }; done
    exit $fail
- id: 6.2.1.2
  title: Ensure auditd service is enabled and active
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    systemctl is-enabled auditd.service 2>/dev/null | grep -qx enabled || { echo 'auditd.service is not enabled'; exit 1; }
    systemctl is-active auditd.service 2>/dev/null | grep -qx active || { echo 'auditd.service is not active'; exit 1; }
    echo 'auditd.service is enabled and active'
- id: 6.2.1.3
  title: Ensure auditing for processes that start prior to auditd is enabled
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    grep -Pq '(^|[[:space:]])audit=1([[:space:]]|$)' /proc/cmdline || { echo 'runtime audit=1 missing'; exit 1; }
    grep -RPsq 'GRUB_CMDLINE_LINUX.*\baudit=1\b' /etc/default/grub /etc/default/grub.d 2>/dev/null || { echo 'persistent audit=1 missing'; exit 1; }
    echo 'audit=1 configured'
- id: 6.2.1.4
  title: Ensure audit_backlog_limit is configured
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(grep -Po 'audit_backlog_limit=\K[0-9]+' /proc/cmdline | tail -1)
    [ -n "$v" ] && [ "$v" -ge 8192 ] || { echo "runtime=${v:-unset}"; exit 1; }
    grep -RPsq 'GRUB_CMDLINE_LINUX.*audit_backlog_limit=([8-9][0-9]{3}|[1-9][0-9]{4,})' /etc/default/grub /etc/default/grub.d 2>/dev/null || { echo 'persistent backlog limit missing'; exit 1; }
    echo "audit_backlog_limit=$v"
- id: 6.2.2.1
  title: Ensure audit log storage size is configured
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(awk -F= '/^[[:space:]]*max_log_file[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print $2}' /etc/audit/auditd.conf | tail -1)
    [ -n "$v" ] && [ "$v" -gt 0 ] || { echo 'max_log_file missing'; exit 1; }
    echo "max_log_file=$v (verify against policy)"
- id: 6.2.2.2
  title: Ensure audit logs are not automatically deleted
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(grep -hE '^[[:space:]]*max_log_file_action[[:space:]]*=' /etc/audit/auditd.conf 2>/dev/null | sed -E 's/^[^=]+=[[:space:]]*//;s/[[:space:]]*(#.*)?$//' | tail -1 | tr '[:upper:]' '[:lower:]')
    [ "$v" = "keep_logs" ] || { echo 'max_log_file_action='"${v:-unset}"', expected keep_logs'; exit 1; }
    echo 'max_log_file_action='$v
- id: 6.2.2.3
  title: Ensure system is disabled when audit logs are full
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    fail=0
    a=$(awk -F= '/^[[:space:]]*disk_full_action[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print tolower($2)}' /etc/audit/auditd.conf | tail -1)
    b=$(awk -F= '/^[[:space:]]*disk_error_action[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print tolower($2)}' /etc/audit/auditd.conf | tail -1)
    case "$a" in halt|single) ;; *) echo "disk_full_action=$a"; fail=1;; esac
    case "$b" in syslog|single|halt) ;; *) echo "disk_error_action=$b"; fail=1;; esac
    exit $fail
- id: 6.2.2.4
  title: Ensure system warns when audit logs are low on space
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    fail=0
    a=$(awk -F= '/^[[:space:]]*space_left_action[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print tolower($2)}' /etc/audit/auditd.conf | tail -1)
    b=$(awk -F= '/^[[:space:]]*admin_space_left_action[[:space:]]*=/{gsub(/[[:space:]]/,"",$2);print tolower($2)}' /etc/audit/auditd.conf | tail -1)
    case "$a" in email|exec|single|halt) ;; *) echo "space_left_action=$a"; fail=1;; esac
    case "$b" in single|halt) ;; *) echo "admin_space_left_action=$b"; fail=1;; esac
    exit $fail
- id: 6.2.3.1
  title: Ensure modification of the /etc/sudoers file is collected
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    disk=$(cat /etc/audit/rules.d/*.rules 2>/dev/null || true)
    run=$(auditctl -l 2>/dev/null || true)
    grep -Pq '/etc/sudoers' <<<"$disk" || { echo 'On-disk audit rule missing: /etc/sudoers'; exit 1; }
    grep -Pq '/etc/sudoers' <<<"$run" || { echo 'Running audit rule missing: /etc/sudoers'; exit 1; }
    echo 'Rule present on disk and at runtime: /etc/sudoers'
