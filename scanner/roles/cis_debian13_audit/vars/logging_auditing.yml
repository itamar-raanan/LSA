- id: 6.3.1
  title: Ensure AIDE is installed
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    dpkg-query -W -f='${db:Status-Status} ${Version}\n' aide 2>/dev/null | grep -q '^installed ' || { echo 'aide is not installed'; exit 1; }
    dpkg-query -W -f='aide=${Version}\n' aide
- id: 6.3.2
  title: Ensure filesystem integrity is regularly checked
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    systemctl is-enabled aidecheck.timer 2>/dev/null | grep -qx enabled && { echo 'aidecheck.timer enabled'; exit 0; }
    grep -RPsq '^[^#].*\baide(check)?\b' /etc/cron.d /etc/cron.daily /etc/cron.weekly /var/spool/cron/crontabs 2>/dev/null && { echo 'AIDE scheduled'; exit 0; }
    echo 'AIDE is not scheduled'; exit 1
- id: 6.3.3
  title: Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    cfg=$(cat /etc/aide/aide.conf /etc/aide/aide.conf.d/* 2>/dev/null)
    fail=0
    for f in auditctl aureport ausearch autrace auditd augenrules; do grep -Pq "/(sbin|usr/sbin)/$f[[:space:]].*(sha256|sha512)" <<<"$cfg" || { echo "Missing AIDE hash rule for $f"; fail=1; }; done
    exit $fail
