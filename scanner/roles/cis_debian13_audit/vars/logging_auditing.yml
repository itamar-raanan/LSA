- id: 6.1.2.3
  title: Ensure journald is configured to send logs to rsyslog
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(grep -hE '^[[:space:]]*ForwardToSyslog[[:space:]]*=' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/*.conf 2>/dev/null | sed -E 's/^[^=]+=[[:space:]]*//;s/[[:space:]]*(#.*)?$//' | tail -1 | tr '[:upper:]' '[:lower:]')
    [ "$v" = "yes" ] || { echo 'ForwardToSyslog='"${v:-unset}"', expected yes'; exit 1; }
    echo 'ForwardToSyslog='$v
- id: 6.1.2.4
  title: Ensure rsyslog log file creation mode is configured
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    v=$(grep -hE '^[[:space:]]*\$FileCreateMode[[:space:]]+' /etc/rsyslog.conf /etc/rsyslog.d/*.conf 2>/dev/null | awk '{print $2}' | tail -1)
    [ -n "$v" ] || { echo '$FileCreateMode missing'; exit 1; }
    [ $((8#$v & 0027)) -eq 0 ] || { echo "mode=$v"; exit 1; }
    echo "$FileCreateMode=$v"
- id: 6.1.2.7
  title: Ensure rsyslog is not configured to receive logs from a remote client
  profiles:
  - level1_server
  - level1_workstation
  expected: System satisfies the benchmark audit procedure
  audit: !unsafe |
    bad=$(grep -RHE '^[[:space:]]*(module\(load="im(tcp|udp)"|input\(type="im(tcp|udp)"|\$ModLoad[[:space:]]+im(tcp|udp)|\$(InputTCPServerRun|UDPServerRun))' /etc/rsyslog.conf /etc/rsyslog.d 2>/dev/null || true)
    [ -z "$bad" ] || { echo "$bad"; exit 1; }
    echo 'No remote receive input configured'
- id: 6.1.2.9
  title: Ensure rsyslog-gnutls is installed
  profiles:
  - level2_server
  - level2_workstation
  expected: System satisfies the benchmark audit procedure
