  when: (cis_control.profiles | intersect(cis_effective_profiles) | length) > 0 and cis_policy_control_modes.get('CIS-DEBIAN13-' ~ cis_control.id, cis_policy_default_mode) != 'disabled'
  tags: [section_2, section_2_1]

