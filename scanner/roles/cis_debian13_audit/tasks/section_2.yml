---
- name: Load Section 2 control definitions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/server_services.yml"
  tags: [section_2, section_2_1]

- name: Section 2.1 - Automated server service controls
  ansible.builtin.include_tasks: audit_shell_control.yml
  loop: "{{ cis_server_service_controls | selectattr('assessment', 'equalto', 'Automated') | list }}"
  loop_control:
    loop_var: cis_control
    label: "{{ cis_control.id }} {{ cis_control.title }}"
  when: (cis_control.profiles | intersect(cis_effective_profiles) | length) > 0 and cis_policy_control_modes.get('CIS-DEBIAN13-' ~ cis_control.id, cis_policy_default_mode) != 'disabled'
  tags: [section_2, section_2_1]

- name: Section 2.1 - Manual server service controls
  ansible.builtin.include_tasks: audit_manual_control.yml
  loop: "{{ cis_server_service_controls | selectattr('assessment', 'equalto', 'Manual') | list }}"
