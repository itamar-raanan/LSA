---
- name: Load Section 1 control definitions
  ansible.builtin.include_vars:
    file: "{{ item }}"
  loop:
    - "{{ role_path }}/vars/kernel_modules.yml"
    - "{{ role_path }}/vars/filesystem_mounts.yml"
    - "{{ role_path }}/vars/package_management.yml"
    - "{{ role_path }}/vars/apparmor.yml"
    - "{{ role_path }}/vars/bootloader.yml"
    - "{{ role_path }}/vars/process_hardening.yml"
    - "{{ role_path }}/vars/warning_banners.yml"
    - "{{ role_path }}/vars/gdm.yml"
  tags:
    - section_1
    - section_1_1
    - section_1_1_1
    - section_1_1_2
    - section_1_2
    - section_1_2_1
    - section_1_2_2
    - section_1_3
    - section_1_3_1
    - section_1_4
    - section_1_5
    - section_1_6
    - section_1_7

- name: Section 1.1.1 - Filesystem kernel modules
  ansible.builtin.include_tasks: audit_kernel_module.yml
  loop: "{{ cis_kernel_module_controls }}"
  loop_control:
    loop_var: cis_control
    label: "{{ cis_control.id }} {{ cis_control.title }}"
  when: (cis_control.profiles | intersect(cis_effective_profiles) | length) > 0 and cis_policy_control_modes.get('CIS-DEBIAN13-' ~ cis_control.id, cis_policy_default_mode) != 'disabled'
  tags: [section_1, section_1_1, section_1_1_1]

- name: Section 1.1.2 - Filesystem partitions and mount options
  ansible.builtin.include_tasks: audit_mount.yml
  loop: "{{ cis_filesystem_mount_controls }}"
