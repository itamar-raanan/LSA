name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check apps scanner
      - run: pytest --cov=lsa --cov-report=term-missing
      - run: ansible-playbook --syntax-check -i inventory.example.ini playbooks/scan.yml
        working-directory: scanner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure production-like stack
        run: cp deploy/.env.example deploy/.env
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml config --quiet
      - name: Build and start platform
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml up --build -d --wait --wait-timeout 180
      - name: Smoke test web, API, database, and evidence vault
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q "Linux Security Auditor"
          curl --fail --silent --show-error http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:8080/ready | grep -q '"database":"connected"'
          curl --fail --silent --show-error http://127.0.0.1:8080/ready | grep -q '"evidence_vault":"connected"'
          python3 deploy/smoke_test.py \
            http://127.0.0.1:8080 \
            admin@example.com \
            replace-with-a-long-administrator-password
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --no-color
      - name: Stop platform
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml down --volumes

  scanner-integration:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Prepare Debian 13 target
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip git openssh-server cron unattended-upgrades iproute2 procps nftables auditd apparmor-utils sudo
          mkdir -p /run/sshd /var/log/journal
          printf '%s\n' '82db0b4b8c5f4e98b4d3c7a62821d013' > /etc/machine-id
      - uses: actions/checkout@v5
      - name: Install scanner and API dependencies
        run: python3 -m pip install --break-system-packages -e ".[dev]"
      - name: Execute scanner inside Debian 13
        run: |
          python3 scripts/generate_signing_key.py /tmp/lsa-integration-signing-key.pem
          ansible-playbook -i tests/inventory.debian13.ini playbooks/scan.yml
        working-directory: scanner
      - name: Validate and ingest generated bundle
        run: python3 scanner/tests/verify_debian13_integration.py /tmp/lsa-integration-reports
